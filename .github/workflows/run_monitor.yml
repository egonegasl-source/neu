name: On-Chain Monitor & Sync

on:
  schedule:
    - cron: '*/5 * * * *'  # Läuft alle 5 Minuten
  workflow_dispatch:      # Ermöglicht den manuellen Start

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Notwendig, damit die Action Änderungen committen und pushen darf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor.py
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python monitor.py

      - name: Commit and push updated on-chain data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: onchain_data.json
          commit_message: "chore: update on-chain data [skip ci]"
          branch: main
